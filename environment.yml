# CartoVec PFA — environnement Conda unifie (CPU par defaut)
#
# Installation rapide :
#     conda env create -f environment.yml
#     conda activate pfa
#
# Pour activer le GPU NVIDIA (RTX 2050 / Colab T4), apres l'install ci-dessus :
#     pip uninstall -y torch torchvision
#     pip install torch==2.2.2 torchvision==0.17.2 \
#         --index-url https://download.pytorch.org/whl/cu121
#
# Verification :
#     python scripts/diagnose_env.py
#
# Ce fichier remplace l'ancien environment_cuda.yml — la difference CUDA / CPU
# se gere via la commande pip ci-dessus, pas via un fichier YAML separe.

name: pfa
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10

  # Scientific stack
  - numpy>=1.26,<2.0
  - scipy>=1.11
  - pandas>=2.1
  - openpyxl>=3.1

  # Computer vision
  - opencv>=4.9
  - scikit-image>=0.22
  - pillow>=10.2

  # Geospatial stack (conda-forge essentiel sur Windows)
  - gdal>=3.8
  - rasterio>=1.3
  - shapely>=2.0
  - geopandas>=0.14
  - fiona>=1.9
  - pyogrio>=0.7
  - pyproj>=3.6

  # Web / API
  - django>=5.0
  - djangorestframework>=3.15
  - django-cors-headers>=4.3
  - nodejs>=20

  # Notebooks
  - jupyter>=1.0
  - jupyterlab>=4.0
  - matplotlib>=3.8
  - seaborn>=0.13
  - ipywidgets>=8.1

  # Utilities
  - tqdm>=4.66
  - python-dotenv>=1.0
  - pyyaml>=6.0
  - rich>=13.0

  # Tests
  - pytest>=8.0
  - pytest-django>=4.8

  - pip
  - pip:
      # PyTorch CPU par defaut. Voir l'en-tete pour activer la CUDA.
      - torch>=2.2
      - torchvision>=0.17

      # Stack segmentation / entrainement
      - segmentation-models-pytorch>=0.3.3
      - albumentations>=1.4
      - timm>=0.9.16

      # Agent LangGraph (optionnel ; fallback automatique si absent)
      - langgraph>=0.1.0
      - langchain-core>=0.2.0

      # Django addons
      - django-leaflet>=0.30
      - django-geojson>=4.0

      # Windows : helper utilise par cartovec/settings.py pour DLL GDAL.
      - pywin32>=306; platform_system == "Windows"
