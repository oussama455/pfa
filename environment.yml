name: pfa
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10

  # Calcul scientifique
  - numpy>=1.26
  - scipy>=1.11

  # Vision par ordinateur
  - opencv>=4.9
  - scikit-image>=0.22
  - pillow>=10.2

  # Geomatique : raster (rasterio bundle GDAL via conda-forge — bien plus
  # fiable qu'un pip install sur Windows)
  - rasterio>=1.3
  - gdal

  # Geomatique : vecteur
  - shapely>=2.0
  - geopandas>=0.14
  - fiona>=1.9
  - pyproj>=3.6

  # Framework web
  - django>=5.0

  # Notebook
  - jupyter>=1.0
  - jupyterlab
  - matplotlib>=3.8
  - ipywidgets>=8.1

  # Utilitaires
  - tqdm>=4.66
  - python-dotenv>=1.0
  - pyyaml>=6.0

  # Tests
  - pytest>=8.0
  - pytest-django>=4.8

  # Deps pip-only (pas dans conda-forge)
  - pip
  - pip:
    - django-leaflet>=0.30
    - django-geojson>=4.0

    # PyTorch + segmentation_models_pytorch
    # Pour CUDA, utilise plutot la commande dediee :
    #   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
    - torch>=2.2
    - torchvision>=0.17
    - segmentation-models-pytorch>=0.3.3
    - albumentations>=1.4
